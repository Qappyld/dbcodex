name: Publier DBCodex portable
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Nouveautés de cette version (texte public)
        required: true
        type: string
      publish:
        description: Publier la release (désactiver pour seulement valider le pipeline)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-portable
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @dbcodex/core
      - run: npm run build --workspace @dbcodex/ui
      - run: npm run typecheck:desktop
      - run: npx vitest run --config vitest.portable.config.ts
      - run: npm run build:desktop
      - run: npm run package:desktop
      - name: Signer la mise à jour
        run: node scripts/sign-update.mjs
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_RELEASE_NOTES: ${{ inputs.notes }}
      - name: Vérifier le paquet public signé
        shell: pwsh
        env:
          DBCODEX_RELEASE_OUT: release
        run: node scripts/audit-portable-release.mjs
      - name: Publier les fichiers compilés dans le dépôt public
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $config = Get-Content -LiteralPath release-config.json -Raw | ConvertFrom-Json
          $metadata = gh api "repos/$($config.repository)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.private) { throw 'Le dépôt de distribution doit être public et accessible.' }
          $tag = "v$($config.version)"
          $archive = "release/DBCodex-$($config.version)-win-x64.zip"
          $portable = "release/DBCodex-$($config.version)-win-x64.exe"
          [IO.File]::WriteAllText((Join-Path $PWD 'build/release-notes.txt'), $env:RELEASE_NOTES)
          gh release create $tag $portable release/portable-update-manifest.json $archive release/update-manifest.json --repo $config.repository --title "DBCodex $($config.version)" --notes-file build/release-notes.txt --draft
          if ($LASTEXITCODE -ne 0) { throw 'Publication du brouillon impossible. Une version existante ne sera pas remplacée.' }
          gh release edit $tag --repo $config.repository --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Le brouillon est conservé. Vérifier les fichiers avant de le publier.' }
